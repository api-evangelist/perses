aid: perses
name: Perses
description: >-
  Perses is an open-source monitoring and dashboarding tool designed as a
  modern alternative for visualizing time-series data with a focus on
  performance, extensibility, and GitOps. Perses exposes a REST API for
  managing dashboards, datasources, ephemeral dashboards, projects, roles,
  role bindings, secrets, users, variables, plugins, validation, and
  migrations. It is a CNCF sandbox project.
